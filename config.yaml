# Per-company ATS wiring for the connectors in ats_connectors.py (spec
# section 5/6). Only entries with a `board_token`/`site_id`/`job_board_name`
# were actually verified reachable in this build (see
# connector_test_report.md) - Canonical and GitLab on Greenhouse, Camunda on
# Ashby. Every other watchlist company is intentionally left UNCONFIGURED
# rather than guessing a board token that was never confirmed live: an
# unconfigured company still shows up in the Connector Status dashboard as
# "requires manual configuration", it is never silently skipped. See
# COMPANY_WATCHLIST_SETUP.md for exactly how to find and add a company's
# real board token yourself (a few minutes each, no coding).
ats_directory:
  Canonical:
    ats: greenhouse
    board_token: canonical
  GitLab:
    ats: greenhouse
    board_token: gitlab
  Camunda:
    ats: ashby
    job_board_name: camunda
  # Unconfigured (see COMPANY_WATCHLIST_SETUP.md to fill these in):
  PagoPA: {ats: unconfigured}
  VF Corporation: {ats: unconfigured}
  BMW Group: {ats: unconfigured}
  lastminute.com: {ats: unconfigured}
  Medacta: {ats: unconfigured}
  Satispay: {ats: unconfigured}
  Product People:
    ats: greenhouse
    board_token: productpeople
  Remote:
    ats: greenhouse
    board_token: remotecom
  Automattic:
    ats: greenhouse
    board_token: automatticcareers
  Storyblok:
    ats: greenhouse
    board_token: storyblok
  Sysdig: {ats: unconfigured}
  Launchmetrics: {ats: unconfigured}
  360dialog: {ats: unconfigured}
  ShippyPro: {ats: unconfigured}
  Jet HR: {ats: unconfigured}
  Revolut: {ats: unconfigured}
  Kering: {ats: unconfigured}

scoring:
  # Percent weights, must sum to 100.
  role_weight: 20
  skills_weight: 20
  seniority_weight: 15
  location_weight: 15
  contract_compensation_weight: 10
  sector_weight: 8
  growth_weight: 5
  language_weight: 4
  brand_weight: 3
  bands:
    apply_now: 90
    strong_opportunity: 82
    consider: 75
    stretch: 65
    # below stretch -> "Hidden"

